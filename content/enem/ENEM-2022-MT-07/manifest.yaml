  "question": {
    "stem": "Uma loja comercializa cinco modelos de caixas-d’água (I, II, III, IV e V), todos em\nformato de cilindro reto de base circular. Os modelos II, III, IV e V têm as especificações\nde suas dimensões dadas em relação às dimensões do modelo I, cuja profundidade é P e\nárea da base é , como segue:\n\n      • modelo II: o dobro da profundidade e a metade da área da base do modelo I;\n\n      • modelo III: o dobro da profundidade e a metade do raio da base do modelo I;\n\n      • modelo IV: a metade da profundidade e o dobro da área da base do modelo I;\n\n      • modelo V: a metade da profundidade e o dobro do raio da base do modelo I.\n\n    Uma pessoa pretende comprar nessa loja o modelo de caixa-d’água que ofereça a\nmaior capacidade volumétrica.\n\nO modelo escolhido deve ser o",
    "options": {
      "A": "I.",
      "B": "II.",
      "C": "III.",
      "D": "IV.",
      "E": "V.\n\n\n                                                                                              /"
    },
    "answer": "E"
  },
  "solution": {
    "data": [
      "modelo I: área da base A e profundidade P",
      "II: 2P e A/2",
      "III: 2P e raio r/2",
      "IV: P/2 e área 2A",
      "V: P/2 e raio 2r"
    ],
    "goal": "Identificar a caixa de maior capacidade.",
    "hook": "Aqui a armadilha é confundir dobrar o raio com dobrar a área.",
    "strategy": [
