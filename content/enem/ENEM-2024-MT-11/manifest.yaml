  "question": {
    "stem": "Em uma empresa é comercializado um produto em embalagens em formato de cilindro circular reto, com raio medindo 3 centímetros, e altura medindo 15 centímetros. Essa empresa planeja comercializar o mesmo produto em embalagens em formato de cubo, com capacidade igual a 80 por cento da capacidade da embalagem cilíndrica utilizada atualmente.\nUse 3 como valor aproximado para pi.\n\nA medida da aresta da nova embalagem, em centímetro, deve ser",
    "options": {
      "A": "6",
      "B": "18",
      "C": "6 vezes raiz quadrada de 6",
      "D": "6 vezes raiz cúbica de 6",
      "E": "3 vezes raiz cúbica de 12"
    },
    "answer": "E"
  },
  "solution": {
    "data": [
      "cilindro: r=3 cm e h=15 cm",
      "π≈3",
      "cubo terá 80% da capacidade do cilindro",
      "volume do cubo: a³"
    ],
    "goal": "Encontrar a aresta do cubo.",
    "hook": "Primeiro obtenha 80% do volume cilíndrico; depois tire a raiz cúbica.",
    "strategy": [
      "Calcular o volume cilíndrico.",
      "Tomar 80% desse volume.",
      "Isolar a por raiz cúbica."
    ],
    "steps": [
      {
        "label": "Volume do cilindro",
        "math": "V_c=\\pi r^2h=3\\cdot3^2\\cdot15=405"
      },
      {
        "label": "O cubo terá 80%",
        "math": "V_q=0{,}8\\cdot405=324"
      },
      {
        "label": "Volume do cubo",
        "math": "a^3=324"
      },
      {
        "label": "Extraia a raiz cúbica positiva",
        "math": "a=\\sqrt[3]{324}"
      },
      {
        "label": "Fatore 324=27·12",
        "math": "a=\\sqrt[3]{27\\cdot12}=3\\sqrt[3]{12}\\ \\mathrm{cm}"
      }
    ],
    "final_answer": "E"
  },
