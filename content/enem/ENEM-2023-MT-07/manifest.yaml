        "label": "Área da piscina",
        "math": "\\ell^2=400"
      },
      {
        "label": "Raiz positiva",
        "math": "\\ell=\\sqrt{400}=20\\ \\mathrm m"
      },
      {
        "label": "Lado externo",
        "math": "L=20+5+5=30\\ \\mathrm m"
      },
      {
        "label": "Diferença de áreas",
        "math": "A_{cal}=30^2-20^2"
      },
      {
        "label": "Calcule",
        "math": "A_{cal}=900-400=500\\ \\mathrm{m^2}"
      }
    ],
    "final_answer": "D"
  },
