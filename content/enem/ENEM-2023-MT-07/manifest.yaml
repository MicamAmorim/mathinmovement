  "question": {
    "stem": "Na planta baixa de um clube, a piscina é representada por um quadrado cuja área real mede 400 metros quadrados. Ao redor dessa piscina, será construída uma calçada, de largura constante igual a 5 metros.\n\nDescrição da figura: Figura de um quadrado representando uma piscina, emoldurado por uma faixa de largura constante igual a 5 metros, representando a calçada. (Fim da descrição)\n\nQual é a medida da área, em metro quadrado, ocupada pela calçada?",
    "options": {
      "A": "1000",
      "B": "900",
      "C": "600",
      "D": "500",
      "E": "400"
    },
    "answer": "D"
  },
  "solution": {
    "data": [
      "piscina quadrada com área 400 m²",
      "calçada de 5 m ao redor",
      "largura acrescentada nos dois lados de cada dimensão"
    ],
    "goal": "Encontrar somente a área da calçada.",
    "hook": "A calçada é uma moldura: quadrado de fora menos quadrado de dentro.",
    "strategy": [
      "Extrair a raiz para achar o lado da piscina.",
      "Calcular o lado do quadrado externo.",
      "Subtrair a área interna."
    ],
    "steps": [
