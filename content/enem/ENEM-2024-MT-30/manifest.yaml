  "question": {
    "stem": "Uma indústria faz uma parceria com uma distribuidora de sucos para lançar no mercado dois tipos de embalagens. Para a fabricação dessas embalagens, a indústria dispõe de folhas de alumínio retangulares, de dimensões 10 centímetros por 20 centímetros. Cada uma dessas folhas é utilizada para formar a superfície lateral da embalagem, em formato de cilindro circular reto, que posteriormente recebe fundo e tampa circulares. A figura ilustra, dependendo de qual das duas extensões será utilizada como altura, as duas opções para formar a possível embalagem.\n\nDescrição da figura: A figura tem duas partes. A primeira, intitulada “embalagem 1”, apresenta um retângulo de lados medindo 20 centímetros e 10 centímetros, e um cilindro de altura medindo 20 centímetros. A segunda, intitulada “embalagem 2”, apresenta um retângulo de lados medindo 10 centímetros e 20 centímetros, e um cilindro de altura medindo 10 centímetros. (Fim da descrição)\n\nDentre essas duas embalagens, a de maior capacidade apresentará volume, em centímetro cúbico, igual a",
    "options": {
      "A": "4000 vezes pi.",
      "B": "2000 vezes pi.",
      "C": "fração, numerador 4000, denominador pi.",
      "D": "fração, numerador 1000, denominador pi.",
      "E": "fração, numerador 500, denominador pi."
    },
    "answer": "D"
  },
  "solution": {
    "data": [
      "folha lateral: 10×20 cm",
      "embalagem 1: h=20 e circunferência=10",
      "embalagem 2: h=10 e circunferência=20",
      "2πr é a largura enrolada"
    ],
    "goal": "Escolher a embalagem de maior volume.",
    "hook": "A mesma folha gera dois cilindros; trocar altura e circunferência muda muito o raio.",
    "strategy": [
      "Achar o raio de cada embalagem.",
      "Calcular V=πr²h.",
      "Comparar os volumes."
    ],
    "steps": [
      {
        "label": "Embalagem 1: 2πr₁=10",
        "math": "r_1={10\\over2\\pi}={5\\over\\pi}"
      },
      {
        "label": "Volume 1",
        "math": "V_1=\\pi(5/\\pi)^2(20)={500\\over\\pi}"
      },
      {
        "label": "Embalagem 2: 2πr₂=20",
        "math": "r_2={20\\over2\\pi}={10\\over\\pi}"
      },
      {
        "label": "Volume 2",
        "math": "V_2=\\pi(10/\\pi)^2(10)={1000\\over\\pi}"
      },
      {
        "label": "Compare; π é positivo",
        "math": "{1000\\over\\pi}>{500\\over\\pi}\\quad\\Rightarrow\\quad V_2"
      }
    ],
    "final_answer": "D"
  },
