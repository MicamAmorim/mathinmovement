  "question": {
    "stem": "A água utilizada pelos 75 moradores de um vilarejo provém de um reservatório de formato cilíndrico circular reto cujo raio da base mede 5 metros, sempre abastecido no primeiro dia de cada mês por caminhões-pipa. Cada morador desse vilarejo consome, em média, 200 litros de água por dia.\nNo mês de junho de um determinado ano, o vilarejo festejou o dia do seu padroeiro e houve um gasto extra de água nos primeiros 20 dias. Passado esse período, as pessoas verificaram a quantidade de água presente no reservatório e constataram que o nível da coluna de água estava em 1,5 metro. Decidiram, então, fazer um racionamento de água durante os 10 dias seguintes.\nConsidere 3 como aproximação para pi.\n\nQual é a quantidade mínima de água, em litro, que cada morador, em média, deverá economizar por dia, de modo que o reservatório não fique sem água nos próximos 10 dias?",
    "options": {
      "A": "50",
      "B": "60",
      "C": "80",
      "D": "140",
      "E": "150"
    },
    "answer": "A"
  },
  "solution": {
    "data": [
      "75 moradores",
      "consumo habitual 200 L/pessoa/dia",
      "água restante: cilindro de r=5 m e h=1,5 m",
      "racionamento por 10 dias",
      "π≈3"
    ],
    "goal": "Achar a economia mínima diária por morador.",
    "hook": "Descubra quanto cada morador pode gastar por dia e compare com os 200 litros habituais.",
    "strategy": [
      "Calcular a água restante.",
      "Distribuir por morador e por dia.",
      "Comparar com o consumo habitual."
    ],
    "steps": [
      {
        "label": "Volume restante",
        "math": "V=\\pi r^2h=3\\cdot5^2\\cdot1{,}5=112{,}5\\ \\mathrm{m^3}"
      },
      {
        "label": "Converta em litros",
        "math": "112{,}5\\ \\mathrm{m^3}=112500\\ \\mathrm L"
      },
      {
        "label": "Pessoas-dia",
        "math": "75\\cdot10=750"
      },
      {
        "label": "Consumo diário possível",
        "math": "{112500\\over750}=150\\ \\mathrm L"
      },
      {
        "label": "Economia mínima",
        "math": "200-150=50\\ \\mathrm{L/pessoa/dia}"
      }
    ],
    "final_answer": "A"
  },
