      {
        "label": "Cancele o fator positivo π/4",
        "math": "a^2>b^2+c^2"
      },
      {
        "label": "Lei dos cossenos",
        "math": "a^2=b^2+c^2-2bc\\cos\\alpha"
      },
      {
        "label": "Substitua na desigualdade",
        "math": "b^2+c^2-2bc\\cos\\alpha>b^2+c^2"
      },
      {
        "label": "Subtraia b²+c² dos dois lados",
        "math": "-2bc\\cos\\alpha>0"
      },
      {
        "label": "Como b,c>0, divida por −2bc e inverta o sinal",
        "math": "\\cos\\alpha<0"
      },
      {
        "label": "Cosseno negativo no triângulo",
        "math": "90^\\circ<\\alpha<180^\\circ"
      }
    ],
    "final_answer": "C"
  },
