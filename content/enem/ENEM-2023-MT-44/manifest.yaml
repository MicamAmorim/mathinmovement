      "lado a está oposto ao ângulo α",
      "diâmetros das pizzas são a, b e c",
      "área de círculo é proporcional ao quadrado do diâmetro",
      "área da pizza do professor é maior que a soma das outras"
    ],
    "goal": "Determinar em que intervalo está α.",
    "hook": "Áreas de pizzas viram quadrados dos diâmetros; depois entra a lei dos cossenos.",
    "strategy": [
      "Transformar a comparação de áreas em comparação de quadrados.",
      "Aplicar a lei dos cossenos.",
      "Analisar o sinal de cos α."
    ],
    "steps": [
