  "question": {
    "stem": "Sejam a, b e c as medidas dos lados de um triângulo retângulo, tendo a como medida da hipotenusa. Esses valores a, b e c são, respectivamente, os diâmetros dos círculos C índice 1, C índice 2 e C índice 3, como apresentados na figura.\n\nDescrição da figura: A figura apresenta um triângulo retângulo de lados a, b e c; o círculo C índice 1, que tem o lado a do triângulo como diâmetro; o círculo C índice 2, que tem o lado b do triângulo como diâmetro, e o círculo C índice 3, que tem o lado c do triângulo como diâmetro. (Fim da descrição)\n\nEssa construção assegura, pelo teorema de Pitágoras, que área de C índice 1 é igual a área de C índice 2 mais área de C índice 3.\nUm professor de matemática era conhecedor dessa construção e, confraternizando com dois amigos em uma pizzaria onde são vendidas pizzas somente em formato de círculo, lançou um desafio: mesmo sem usar um instrumento de medição, poderia afirmar com certeza se a área do círculo correspondente à pizza que ele pedisse era maior, igual ou menor do que a soma das áreas das pizzas dos dois amigos. Assim, foram pedidas três pizzas. O professor as dividiu ao meio e formou um triângulo com os diâmetros das pizzas, conforme indicado na figura.\n\nDescrição da figura: Figura de um triângulo, em que um dos ângulos tem medida igual a alfa e cada um de seus lados é diâmetro de um semicírculo. O semicírculo, cujo diâmetro é o lado oposto ao ângulo alfa, representa a meia pizza do professor de matemática; os outros dois semicírculos representam a meia pizza do amigo 1 e a meia pizza do amigo 2. (Fim da descrição)\n\nA partir da medida do ângulo alfa, o professor afirmou que a área de sua pizza é maior do que a soma das áreas das outras duas pizzas.\n\nA área da pizza do professor de matemática é maior do que a soma das áreas das outras duas pizzas, pois",
    "options": {
      "A": "zero grau menor que alfa menor que 90 graus.",
      "B": "alfa igual a 90 graus.",
      "C": "90 graus menor que alfa menor que 180 graus.",
      "D": "alfa igual a 180 graus.",
      "E": "180 graus menor que alfa menor que 360 graus."
    },
    "answer": "C"
  },
  "solution": {
