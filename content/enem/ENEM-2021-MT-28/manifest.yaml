  "question": {
    "stem": "Um parque temático brasileiro construiu uma réplica em miniatura do castelo de\nLiechtenstein. O castelo original, representado na imagem, está situado na Alemanha e\nfoi reconstruído entre os anos de 1840 e 1842, após duas destruições causadas por\nguerras.\n\n\n     O castelo possui uma ponte de 38,4 m de comprimento e 1,68 m de largura. O\nartesão que trabalhou para o parque produziu a réplica do castelo, em escala. Nessa\nobra, as medidas do comprimento e da largura da ponte eram, respectivamente, 160 cm e\n7 cm.\n\nA escala utilizada para fazer a réplica é",
    "options": {
      "A": "1 : 576",
      "B": "1 : 240",
      "C": "1 : 24",
      "D": "1 : 4,2",
      "E": "1 : 2,4"
    },
    "answer": "C"
  },
  "solution": {
    "data": [
      "ponte real: 38,4 m",
      "ponte na réplica: 160 cm",
      "largura real: 1,68 m",
      "largura na réplica: 7 cm"
    ],
    "goal": "Encontrar a escala da réplica.",
    "hook": "Escala só funciona depois que as duas medidas estão na mesma unidade.",
    "strategy": [
      "Colocar real e desenho na mesma unidade.",
      "Formar desenho/real.",
      "Simplificar a razão."
    ],
    "steps": [
