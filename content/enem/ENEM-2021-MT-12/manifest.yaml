  "question": {
    "stem": "Uma pessoa comprou uma caneca para tomar sopa, conforme ilustração.\n\n\n      Sabe-se que 1 cm3 = 1 mL e que o topo da caneca é uma circunferência de\ndiâmetro (D) medindo 10 cm, e a base é um círculo de diâmetro (d) medindo 8 cm. Além\ndisso, sabe-se que a altura (h) dessa caneca mede 12 cm (distância entre o centro das\ncircunferências do topo e da base).\n\n      Utilize 3 como aproximação para π.\n\nQual é a capacidade volumétrica, em mililitro, dessa caneca?",
    "options": {
      "A": "216",
      "B": "408",
      "C": "732",
      "D": "2 196",
      "E": "2 928"
    },
    "answer": "C"
  },
  "solution": {
    "data": [
      "topo: diâmetro 10 cm ⇒ R = 5 cm",
      "base: diâmetro 8 cm ⇒ r = 4 cm",
      "altura h = 12 cm",
      "π ≈ 3 e 1 cm³ = 1 mL"
    ],
    "goal": "Calcular a capacidade da caneca.",
    "hook": "A caneca não é um cilindro: os dois raios são diferentes.",
    "strategy": [
      "Reconhecer um tronco de cone.",
      "Aplicar a fórmula do volume.",
      "Converter cm³ em mL."
    ],
    "steps": [
      {
        "label": "Volume do tronco de cone",
        "math": "V={\\pi h\\over3}(R^2+Rr+r^2)"
      },
      {
        "label": "Substitua os dados",
        "math": "V={3\\cdot12\\over3}(5^2+5\\cdot4+4^2)"
      },
      {
        "label": "Cancele 3 no numerador e denominador",
        "math": "V=12(25+20+16)"
      },
      {
        "label": "Some dentro dos parênteses",
        "math": "V=12\\cdot61=732\\ \\mathrm{cm^3}"
      },
      {
        "label": "Use 1 cm³ = 1 mL",
        "math": "V=732\\ \\mathrm{mL}"
      }
    ],
    "final_answer": "C"
  },
