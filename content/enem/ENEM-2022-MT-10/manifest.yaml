  "question": {
    "stem": "O governo de um estado pretende realizar uma obra de infraestrutura para auxiliar na\nintegração e no processo de escoamento da produção agrícola de duas cidades.\nO projeto consiste na interligação direta das cidades A e B com a Rodovia 003, pela\nconstrução das Rodovias 001 e 002. As duas rodovias serão construídas em linha reta e\ndeverão se conectar à Rodovia 003 em um mesmo ponto, conforme esboço apresentado\nna figura, na qual estão também indicadas as posições das cidades A e B, considerando\no eixo x posicionado sobre a Rodovia 003, e cinco localizações sugeridas para o ponto de\nconexão entre as três rodovias.\n\n y (km)                                                             Rodovia 001\n                       Cidade A\n     40\n                                                                    Rodovia 002\n\n       30\n\n       20                                                           Cidade B\n\n\n       10\n               Rodovia 003 I    II III IV   V\n             0   5 10 15 20 25 30 35 40 45 50 55 x (km)\n   Pretende-se que a distância percorrida entre as duas cidades,                    pelas\nRodovias 001 e 002, passando pelo ponto de conexão, seja a menor possível.\n\nDadas as exigências do projeto, qual das localizações sugeridas deve ser a escolhida\npara o ponto de conexão?",
    "options": {
      "A": "I",
      "B": "II",
      "C": "III",
      "D": "IV",
      "E": "V\n\n\n                                                                                             /"
    },
    "answer": "D"
  },
  "solution": {
    "data": [
      "cidade A em (20,40)",
      "cidade B em (50,20)",
      "a Rodovia 003 coincide com o eixo x",
      "candidatos I–V; o ponto IV está em x=40"
    ],
    "goal": "Escolher a conexão que minimiza a soma das duas rodovias.",
    "hook": "Um truque de reflexão transforma duas distâncias em uma única reta.",
    "strategy": [
      "Refletir B em relação ao eixo x.",
      "Trocar o caminho A–X–B pelo segmento reto A–B′.",
      "Achar a interseção desse segmento com o eixo x."
    ],
    "steps": [
      {
        "label": "Reflita B=(50,20) no eixo x",
        "math": "B'=(50,-20)"
      },
      {
        "label": "Coeficiente angular de A até B′",
        "math": "m={-20-40\\over50-20}=-2"
      },
      {
        "label": "Equação da reta passando por A",
        "math": "y-40=-2(x-20)"
      },
      {
        "label": "No ponto de conexão, y=0",
        "math": "0-40=-2(x-20)"
      },
      {
        "label": "Resolva a equação",
        "math": "40=2x-40\\quad\\Rightarrow\\quad x=40"
      },
      {
        "label": "O candidato em x=40 é IV",
        "math": "X=(40,0)\\quad\\Rightarrow\\quad IV"
      }
    ],
    "final_answer": "D"
  },
