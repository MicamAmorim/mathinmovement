  "question": {
    "stem": "Um artista plástico esculpe uma escultura a partir de um bloco de madeira de lei, em etapas. Inicialmente, esculpe um cone reto com 36 centímetros de altura e diâmetro da base medindo 18 centímetros. Em seguida, remove desse cone um cone menor, cujo diâmetro da base mede 6 centímetros obtendo, assim, um tronco de cone, conforme ilustrado na figura.\n\nDescrição da imagem: A imagem é formada por duas figuras. A figura à esquerda apresenta um cone circular reto, com diâmetro da base igual a 18 centímetros e altura igual a 36 centímetros. Nele está destacado um cone circular reto, de mesmo vértice e mesmo eixo de simetria mas altura menor, e cujo diâmetro da base é igual a 6 centímetros.\nA figura à direita mostra o tronco de cone, obtido pela retirada do cone de altura menor do cone de altura maior, do qual foi removido também um cilindro circular reto, de diâmetro igual a 6 centímetros, com o mesmo eixo de simetria que o cone original. (Fim da descrição)\n\nEm seguida, perfura esse tronco de cone, removendo um cilindro reto, de diâmetro 6 centímetros, cujo eixo de simetria é o mesmo do cone original. Dessa forma, ao final, a escultura tem a forma de um tronco de cone com uma perfuração cilíndrica de base a base.\nO tipo de madeira utilizada para produzir essa escultura tem massa igual a 0,6 grama por centímetro cúbico de volume. Utilize 3 como aproximação para pi.\n\nQual é a massa, em grama, dessa escultura?",
    "options": {
      "A": "1198,8",
      "B": "1296,0",
      "C": "1360,8",
      "D": "4665,6",
      "E": "4860,0"
    },
    "answer": "B"
  },
  "solution": {
    "data": [
      "cone maior: R=9 cm e H=36 cm",
      "cone retirado: r=3 cm",
      "cones semelhantes",
      "perfuração cilíndrica de raio 3 cm atravessa o tronco",
      "densidade 0,6 g/cm³; π≈3"
    ],
    "goal": "Calcular a massa da escultura restante.",
    "hook": "A escultura final nasce de duas subtrações de volume, seguidas pela densidade.",
    "strategy": [
      "Achar a altura do cone pequeno por semelhança.",
      "Subtrair os volumes dos cones.",
      "Subtrair o cilindro e aplicar a densidade."
    ],
    "steps": [
      {
        "label": "Semelhança dos cones",
        "math": "{h\\over36}={3\\over9}={1\\over3}"
      },
      {
        "label": "Altura do cone pequeno",
        "math": "h=36/3=12\\ \\mathrm{cm}"
      },
      {
        "label": "Volume do cone maior",
        "math": "V_M={1\\over3}\\cdot3\\cdot9^2\\cdot36=2916"
      },
      {
        "label": "Volume do cone pequeno",
        "math": "V_m={1\\over3}\\cdot3\\cdot3^2\\cdot12=108"
      },
      {
        "label": "Altura do tronco",
        "math": "H_t=36-12=24"
      },
      {
        "label": "Volume do cilindro retirado",
        "math": "V_c=3\\cdot3^2\\cdot24=648"
      },
      {
        "label": "Volume restante",
        "math": "V=2916-108-648=2160\\ \\mathrm{cm^3}"
      },
      {
        "label": "Massa = densidade × volume",
        "math": "m=0{,}6\\cdot2160=1296\\ \\mathrm g"
      }
    ],
    "final_answer": "B"
  },
