  "question": {
    "stem": "A figura ilustra uma roda-gigante no exato instante em que a cadeira onde se encontra a pessoa P está no ponto mais alto dessa roda-gigante.\n\nDescrição da figura: A figura representa uma roda-gigante, cujos suportes estão apoiados ao solo, no instante em que a cadeira onde se encontra uma pessoa P está no ponto mais alto dessa roda. Uma seta indica que a roda-gigante gira no sentido horário. (Fim da descrição)\n\nCom o passar do tempo, à medida que a roda-gigante gira, com velocidade constante e no sentido horário, a altura da cadeira onde se encontra a pessoa P, em relação ao solo, vai se alterando.\n\nO gráfico que melhor representa a variação dessa altura, em função do tempo, contado a partir do instante em que a cadeira da pessoa P se encontra na posição mais alta da roda-gigante, é\n\nDescrição das alternativas: Em cada alternativa há a representação de um gráfico cartesiano, em que o eixo horizontal representa o tempo; e o eixo vertical representa a altura da cadeira onde está a pessoa P em relação ao solo. Todos os gráficos são curvas contínuas que oscilam de um valor máximo a um valor mínimo, sendo o valor mínimo positivo, e iniciam no ponto de abscissa 0 e ordenada igual ao valor máximo.",
    "options": {
      "A": "O gráfico é representado por uma cossenoide.",
      "B": "O gráfico é representado por uma linha poligonal formada por 4 segmentos de reta de mesmo comprimento, decrescentes e crescentes alternadamente.",
      "C": "O gráfico é representado por uma linha poligonal formada por 7 segmentos de reta, 4 deles decrescentes e crescentes alternadamente e de mesmo comprimento, interligados por 3 segmentos de reta horizontais de mesmo comprimento.",
      "D": "O gráfico é representado por 3 arcos de parábolas com concavidade para baixo, formando uma única curva contínua.",
      "E": "O gráfico é representado por 2 arcos de parábolas com concavidade para cima, formando uma única curva contínua. (Fim da descrição)"
    },
    "answer": "A"
  },
  "solution": {
    "data": [
      "roda-gigante gira com velocidade angular constante",
      "pessoa começa no ponto mais alto",
      "altura varia continuamente e periodicamente",
      "o ponto mais baixo fica acima do solo"
    ],
    "goal": "Escolher o gráfico altura × tempo.",
    "hook": "Movimento circular uniforme visto na vertical produz uma cossenoide.",
    "strategy": [
      "Modelar o movimento circular uniforme.",
      "Projetar a posição vertical.",
      "Comparar forma, período e valor inicial."
    ],
    "steps": [
      {
        "label": "Ângulo cresce linearmente",
        "math": "\\theta(t)=\\omega t"
      },
      {
        "label": "Começando no topo",
        "math": "h(t)=h_c+R\\cos(\\omega t)"
      },
      {
        "label": "No instante inicial",
        "math": "h(0)=h_c+R\\quad\\text{máximo}"
      },
      {
        "label": "A curva é suave e periódica",
        "math": "h(t+2\\pi/\\omega)=h(t)"
      },
      {
        "label": "Logo, é uma cossenoide",
        "math": "\\text{gráfico A}"
      }
    ],
    "final_answer": "A"
  },
