  "question": {
    "stem": "Uma empresa produz e vende um tipo de chocolate, maciço, em formato de cone\ncircular reto com as medidas do diâmetro da base e da altura iguais a 8 cm e 10 cm,\nrespectivamente, como apresenta a figura.\n\n                                         8 cm\n\n\n                                                       10 cm\n\n\n    Devido a um aumento de preço dos ingredientes utilizados na produção desse\nchocolate, a empresa decide produzir esse mesmo tipo de chocolate com um volume\n19% menor, no mesmo formato de cone circular reto com altura de 10 cm.\n\nPara isso, a empresa produzirá esses novos chocolates com medida do raio da base, em\ncentímetro, igual a",
    "options": {
      "A": "1,52.",
      "B": "3,24.",
      "C": "3,60.",
      "D": "6,48.",
      "E": "7,20.\n\n\n                                                                                       /"
    },
    "answer": "C"
  },
  "solution": {
    "data": [
      "cone original: diâmetro 8 cm ⇒ r=4 cm",
      "altura permanece 10 cm",
      "novo volume é 19% menor ⇒ 81% do original"
    ],
    "goal": "Encontrar o novo raio.",
    "hook": "Com a altura fixa, basta acompanhar o quadrado do raio.",
    "strategy": [
      "Formar a razão entre os volumes.",
      "Cancelar fatores iguais.",
      "Extrair a raiz quadrada positiva."
    ],
    "steps": [
      {
        "label": "Volumes antigo e novo",
        "math": "V={1\\over3}\\pi(4)^2(10),\\quad V'={1\\over3}\\pi r'^2(10)"
      },
      {
        "label": "Use V′=0,81V",
        "math": "{1\\over3}\\pi r'^2(10)=0{,}81{1\\over3}\\pi(4)^2(10)"
      },
      {
        "label": "Cancele π, 10 e 1/3",
        "math": "r'^2=0{,}81\\cdot16=12{,}96"
      },
      {
        "label": "Raiz positiva",
        "math": "r'=\\sqrt{12{,}96}=3{,}6\\ \\mathrm{cm}"
      }
    ],
    "final_answer": "C"
  },
