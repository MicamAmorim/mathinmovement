  "question": {
    "stem": "Uma cozinheira produz docinhos especiais por encomenda. Usando uma\nreceita-base de massa, ela prepara uma porção, com a qual produz 50 docinhos maciços\nde formato esférico, com 2 cm de diâmetro. Um cliente encomenda 150 desses docinhos,\nmas pede que cada um tenha formato esférico com 4 cm de diâmetro. A cozinheira\npretende preparar o número exato de porções da receita-base de massa necessário para\nproduzir os docinhos dessa encomenda.\n\nQuantas porções da receita-base de massa ela deve preparar para atender esse cliente?",
    "options": {
      "A": "2",
      "B": "3",
      "C": "6",
      "D": "12",
      "E": "24\n\n\n                                                                                        /"
    },
    "answer": "E"
  },
  "solution": {
    "data": [
      "receita: 50 esferas de diâmetro 2 cm",
      "pedido: 150 esferas de diâmetro 4 cm",
      "o diâmetro e o raio dobram",
      "volume de esfera varia com r³"
    ],
    "goal": "Calcular quantas receitas de massa são necessárias.",
    "hook": "Dobrar o diâmetro dobra o raio, mas multiplica o volume por oito.",
    "strategy": [
      "Calcular o fator de volume de cada doce.",
      "Calcular o fator da quantidade de doces.",
      "Multiplicar os dois fatores."
    ],
    "steps": [
      {
        "label": "Razão dos raios",
        "math": "k={4\\over2}=2"
      },
      {
        "label": "Fator do volume",
        "math": "{V'\\over V}=k^3=2^3=8"
      },
      {
        "label": "Fator da quantidade",
        "math": "{150\\over50}=3"
      },
      {
        "label": "Massa total necessária",
        "math": "3\\cdot8=24\\ \\text{receitas}"
      }
    ],
    "final_answer": "E"
  },
  "visuals": {
