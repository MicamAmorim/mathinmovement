  "question": {
    "stem": "Um proprietário pretende instalar um sensor de presença para a proteção de seu imóvel. O sensor deverá detectar movimentos de objetos e pessoas numa determinada região plana. A figura ilustra a vista superior da área de cobertura (setor circular em azul) de um sensor colocado no ponto S. Essa área depende da medida do ângulo alfa, em grau, e do raio R, em metro.\n\nDescrição da figura: A figura apresenta um setor circular, de centro S, raio R e ângulo alfa. (Fim da descrição)\n\nAo aumentar o ângulo alfa ou o raio R aumenta-se a área de cobertura do sensor. Entretanto, quanto maior essa área, maior o preço do sensor.\nPara esse fim, há cinco tipos de sensores disponíveis no mercado, cada um com as seguintes características:\ntipo 1: alfa é igual a 15 graus e R é igual a 20 metros;\ntipo 2: alfa é igual a 30 graus e R é igual a 22 metros;\ntipo 3: alfa é igual a 40 graus e R é igual a 12 metros;\ntipo 4: alfa é igual a 60 graus e R é igual a 16 metros;\ntipo 5: alfa é igual a 90 graus e R é igual a 10 metros.\n\nEsse proprietário pretende adquirir um desses sensores que seja capaz de cobrir, no mínimo, uma área de medida 70 metros quadrados, com o menor preço possível.\nUse 3 como valor aproximado para pi.\n\nO proprietário do imóvel deverá adquirir o sensor do tipo",
    "options": {
      "A": "1.",
      "B": "2.",
      "C": "3.",
      "D": "4.",
      "E": "5."
    },
    "answer": "E"
  },
  "solution": {
    "data": [
      "área é um setor circular",
      "cinco pares (α,R)",
      "área mínima exigida: 70 m²",
      "π≈3",
      "menor área admissível corresponde ao menor preço"
    ],
    "goal": "Escolher o sensor mais barato que cubra pelo menos 70 m².",
    "hook": "Não basta cobrir 70 m²: entre os que cobrem, escolha a menor área e portanto o menor preço.",
    "strategy": [
      "Calcular A=απR²/360 para cada tipo.",
      "Eliminar áreas menores que 70.",
      "Escolher a menor das áreas restantes."
    ],
    "steps": [
      {
        "label": "Tipo 1: 15°, R=20",
        "math": "A_1={15\\over360}3(20)^2=50"
      },
      {
        "label": "Tipo 2: 30°, R=22",
        "math": "A_2={30\\over360}3(22)^2=121"
      },
      {
        "label": "Tipo 3: 40°, R=12",
        "math": "A_3={40\\over360}3(12)^2=48"
      },
      {
        "label": "Tipo 4: 60°, R=16",
        "math": "A_4={60\\over360}3(16)^2=128"
      },
      {
        "label": "Tipo 5: 90°, R=10",
        "math": "A_5={90\\over360}3(10)^2=75"
      },
      {
        "label": "Admissíveis: 2, 4 e 5; escolha a menor área",
        "math": "75<121<128\\quad\\Rightarrow\\quad\\text{tipo 5}"
      }
    ],
    "final_answer": "E"
  },
