  "question": {
    "stem": "No entorno de uma lagoa circular, cujo raio mede 1 quilômetro, há uma ciclovia. Devido aos frequentes roubos de bicicleta, a prefeitura planeja alocar policiais em posições estratégicas para patrulhar essa ciclovia, de forma a torná-la totalmente protegida. Um ponto da ciclovia é considerado protegido se houver pelo menos um policial a, no máximo, 200 metros de distância daquele ponto, posicionado sobre a ciclovia. A figura ilustra um ponto P sobre a ciclovia, que estará protegido se houver pelo menos um policial posicionado sobre a região de cor cinza-escuro.\nDesconsidere a largura da pista da ciclovia e utilize 3 como aproximação para pi.\n\nDescrição da figura: Figura de um círculo, cuja circunferência representa uma ciclovia na qual está marcado o ponto P, destaca um trecho de 400 metros, em que o ponto P ocupa a posição central. (Fim da descrição)\n\nNessas condições, a quantidade mínima necessária de policiais a serem alocados ao longo dessa ciclovia para torná-la protegida é",
    "options": {
      "A": "4.",
      "B": "8.",
      "C": "15.",
      "D": "30.",
      "E": "60."
    },
    "answer": "C"
  },
  "solution": {
    "data": [
      "lagoa circular de raio 1 km",
      "π≈3",
      "cada policial protege até 200 m para cada lado",
      "cada policial cobre um arco total de 400 m"
    ],
    "goal": "Encontrar o número mínimo de policiais.",
    "hook": "Cada policial cobre um arco de 400 m; falta descobrir quantos desses arcos fecham a circunferência.",
    "strategy": [
      "Calcular o comprimento da ciclovia.",
      "Dividir pelo trecho coberto por um policial.",
      "Verificar se é necessário arredondar para cima."
    ],
    "steps": [
      {
        "label": "Comprimento da ciclovia",
        "math": "C=2\\pi r=2\\cdot3\\cdot1=6\\ \\mathrm{km}"
      },
      {
        "label": "Converta em metros",
        "math": "6\\ \\mathrm{km}=6000\\ \\mathrm m"
      },
      {
        "label": "Cobertura por policial",
        "math": "200+200=400\\ \\mathrm m"
      },
      {
        "label": "Quantidade",
        "math": "n={6000\\over400}=15"
      },
      {
        "label": "A divisão é exata; não há resto",
        "math": "15\\cdot400=6000"
      }
    ],
    "final_answer": "C"
  },
