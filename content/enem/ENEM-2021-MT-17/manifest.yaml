  "question": {
    "stem": "O projeto de um contêiner, em forma de paralelepípedo reto retangular, previa a\npintura dos dois lados (interno e externo) de cada uma das quatro paredes com tinta\nacrílica e a pintura do piso interno com tinta epóxi. O construtor havia pedido, a cinco\nfornecedores diferentes, orçamentos das tintas necessárias, mas, antes de iniciar a obra,\nresolveu mudar o projeto original, alterando o comprimento e a largura para o dobro do\noriginalmente previsto, mantendo inalterada a altura. Ao pedir novos orçamentos aos\nfornecedores, para as novas dimensões, cada um deu uma resposta diferente sobre as\nnovas quantidades de tinta necessárias.\n\n    Em relação ao previsto para o projeto original, as novas quantidades de tinta\nnecessárias informadas pelos fornecedores foram as seguintes:\n\n       Fornecedor I: “O dobro, tanto para as paredes quanto para o piso.”\n       Fornecedor II: “O dobro para as paredes e quatro vezes para o piso.”\n       Fornecedor III: “Quatro vezes, tanto para as paredes quanto para o piso.”\n       Fornecedor IV: “Quatro vezes para as paredes e o dobro para o piso.”\n       Fornecedor V: “Oito vezes para as paredes e quatro vezes para o piso.”\n\n    Analisando as informações dos fornecedores, o construtor providenciará a\nquantidade adequada de material. Considere a porta de acesso do contêiner como parte\nde uma das paredes.\nQual dos fornecedores prestou as informações adequadas, devendo ser o escolhido pelo\nconstrutor para a aquisição do material?",
    "options": {
      "A": "I",
      "B": "II",
      "C": "III",
      "D": "IV",
      "E": "V"
    },
    "answer": "B"
  },
  "solution": {
    "data": [
      "contêiner retangular",
      "comprimento e largura dobram",
      "altura permanece igual",
      "paredes pintadas nos dois lados; piso apenas internamente"
    ],
    "goal": "Determinar como mudam as quantidades de tinta.",
    "hook": "Dobrar comprimentos não multiplica todas as áreas pelo mesmo fator.",
    "strategy": [
      "Escrever a área das paredes.",
      "Aplicar L→2L e W→2W.",
      "Fazer o mesmo com o piso."
    ],
    "steps": [
      {
        "label": "Área das quatro paredes, em um lado",
        "math": "A_p=2Lh+2Wh=2h(L+W)"
      },
      {
        "label": "Dobrar L e W",
        "math": "A'_p=2h(2L+2W)"
      },
      {
        "label": "Coloque 2 em evidência",
        "math": "A'_p=2\\,[2h(L+W)]=2A_p"
      },
      {
        "label": "Área do piso",
        "math": "A_f=LW"
      },
      {
        "label": "Dobrar as duas dimensões do piso",
        "math": "A'_f=(2L)(2W)=4LW=4A_f"
      },
      {
        "label": "Resultado",
        "math": "\\text{paredes: dobro; piso: quádruplo}"
      }
    ],
    "final_answer": "B"
  },
