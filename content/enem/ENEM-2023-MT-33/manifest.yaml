  "question": {
    "stem": "A foto mostra a construção de uma cisterna destinada ao armazenamento de água. Uma cisterna como essa, na forma de cilindro circular reto com 3 metros quadrados de área da base, foi abastecida por um curso-d'água com vazão constante. O seu proprietário registrou a altura do nível da água no interior da cisterna durante o abastecimento em diferentes momentos de um mesmo dia, conforme o quadro.\n\nDescrição do quadro: Quadro que fornece o nível da água, em metro, em quatro horários.\n6 horas: 0,5 metro\n8 horas: 1,1 metro\n12 horas: 2,3 metros\n15 horas: 3,2 metros\n(Fim da descrição)\n\nDescrição da foto: Foto em preto e branco de pessoas construindo uma cisterna em frente a uma casa. (Fim da descrição)\n\nQual foi a vazão, em metro cúbico por hora, do curso-d'água que abasteceu a cisterna?",
    "options": {
      "A": "0,3",
      "B": "0,5",
      "C": "0,9",
      "D": "1,8",
      "E": "2,7"
    },
    "answer": "C"
  },
  "solution": {
    "data": [
      "cisterna com área da base 3 m²",
      "vazão constante",
      "6h: 0,5 m; 8h: 1,1 m; 12h: 2,3 m; 15h: 3,2 m"
    ],
    "goal": "Calcular a vazão em m³/h.",
    "hook": "Vazão constante significa crescimento linear do nível; dois registros já bastam.",
    "strategy": [
      "Escolher dois registros.",
      "Calcular a variação de altura e tempo.",
      "Converter altura em volume pela área da base."
    ],
    "steps": [
      {
        "label": "De 6h a 8h",
        "math": "\\Delta t=8-6=2\\ \\mathrm h"
      },
      {
        "label": "Variação da altura",
        "math": "\\Delta h=1{,}1-0{,}5=0{,}6\\ \\mathrm m"
      },
      {
        "label": "Variação do volume",
        "math": "\\Delta V=A_b\\Delta h=3\\cdot0{,}6=1{,}8\\ \\mathrm{m^3}"
      },
      {
        "label": "Vazão",
        "math": "Q={\\Delta V\\over\\Delta t}={1{,}8\\over2}=0{,}9\\ \\mathrm{m^3/h}"
      },
      {
        "label": "Conferência: de 12h a 15h",
        "math": "Q={3(3{,}2-2{,}3)\\over15-12}=0{,}9"
      }
    ],
    "final_answer": "C"
  },
