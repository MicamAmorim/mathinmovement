  "question": {
    "stem": "O dono de uma loja pretende usar cartões imantados para a divulgação de sua loja.\nA empresa que fornecerá o serviço lhe informa que o custo de fabricação do cartão é de\nR$ 0,01 por centímetro quadrado e que disponibiliza modelos tendo como faces úteis\npara impressão:\n\n        um triângulo equilátero de lado 12 cm;\n        um quadrado de lado 8 cm;\n        um retângulo de lados 11 cm e 8 cm;\n        um hexágono regular de lado 6 cm;\n        um círculo de diâmetro 10 cm.\n\n    O dono da loja está disposto a pagar, no máximo, R$ 0,80 por cartão. Ele escolherá,\ndentro desse limite de preço, o modelo que tiver maior área de impressão.\n\n      Use 3 como aproximação para             e use 1,7 como aproximação para   .\n\nNessas condições, o modelo que deverá ser escolhido tem como face útil para impressão\num",
    "options": {
      "A": "triângulo.",
      "B": "quadrado.",
      "C": "retângulo.",
      "D": "hexágono.",
      "E": "círculo."
    },
    "answer": "E"
  },
  "solution": {
    "data": [
      "custo: R$ 0,01 por cm²",
      "limite: R$ 0,80 ⇒ área máxima permitida 80 cm²",
      "triângulo ℓ=12; quadrado ℓ=8",
      "retângulo 11×8; hexágono ℓ=6; círculo d=10",
      "π≈3 e √3≈1,7"
    ],
    "goal": "Escolher a maior área que não ultrapasse 80 cm².",
    "hook": "Primeiro traduza o limite de preço em um limite de área.",
    "strategy": [
      "Calcular a área dos cinco modelos.",
      "Eliminar os que custam mais de R$ 0,80.",
      "Comparar os modelos restantes."
    ],
    "steps": [
      {
        "label": "Triângulo equilátero",
        "math": "A_t={\\sqrt3\\over4}12^2={1{,}7\\over4}144=61{,}2"
      },
      {
        "label": "Quadrado",
        "math": "A_q=8^2=64"
      },
      {
        "label": "Retângulo",
        "math": "A_r=11\\cdot8=88>80\\quad\\text{elimine}"
      },
      {
        "label": "Hexágono: seis equiláteros",
        "math": "A_h=6{\\sqrt3\\over4}6^2=91{,}8>80\\quad\\text{elimine}"
      },
      {
        "label": "Círculo de raio 5",
        "math": "A_c=\\pi5^2=3\\cdot25=75"
      },
      {
        "label": "Maior área admissível",
        "math": "75>64>61{,}2\\quad\\Rightarrow\\quad\\text{círculo}"
      }
    ],
    "final_answer": "E"
  },
