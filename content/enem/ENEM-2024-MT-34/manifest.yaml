        "math": "{\\sqrt3\\over36}\\approx0{,}0481;\\quad{1\\over16}=0{,}0625;\\quad{\\sqrt3\\over24}\\approx0{,}0722"
      },
      {
        "label": "Maior coeficiente",
        "math": "A_6>A_4>A_3\\quad\\Rightarrow\\quad\\text{hexágono}"
      }
    ],
    "final_answer": "A"
  },
