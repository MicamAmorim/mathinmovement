  "question": {
    "stem": "Um jardineiro dispõe de k metros lineares de cerca baixa para fazer um jardim ornamental. O jardim, delimitado por essa cerca, deve ter a forma de um triângulo equilátero, um quadrado ou um hexágono regular. A escolha será pela forma que resulte na maior área.\n\nO jardineiro escolherá a forma de",
    "options": {
      "A": "hexágono regular, pois a área do jardim, em metro quadrado, será fração, numerador k ao quadrado vezes raiz quadrada de 3, denominador 24.",
      "B": "hexágono regular, pois a área do jardim, em metro quadrado, será fração, numerador 3 vezes k ao quadrado vezes raiz quadrada de 3, denominador 2.",
      "C": "quadrado, pois a área do jardim, em metro quadrado, será fração, numerador k ao quadrado, denominador 16.",
      "D": "triângulo equilátero, pois a área do jardim, em metro quadrado, será fração, numerador k ao quadrado vezes raiz quadrada de 3, denominador 36.",
      "E": "triângulo equilátero, pois a área do jardim, em metro quadrado, será fração, numerador k ao quadrado vezes raiz quadrada de 3, denominador 4."
    },
    "answer": "A"
  },
  "solution": {
    "data": [
      "perímetro disponível: k",
      "formas: equilátero, quadrado ou hexágono regular",
      "cada forma deve usar todo o perímetro"
    ],
    "goal": "Escolher a forma de maior área.",
    "hook": "Com perímetro fixo, compare as áreas depois de escrever cada lado em função de k.",
    "strategy": [
      "Escrever o lado de cada figura em função de k.",
      "Calcular as três áreas.",
      "Comparar os coeficientes de k²."
    ],
    "steps": [
