  "question": {
    "stem": "Peças metálicas de aeronaves abandonadas em aeroportos serão recicladas. Uma\ndessas peças é maciça e tem o formato cilíndrico, com a medida do raio da base igual a\n4 cm e a da altura igual a 50 cm. Ela será derretida, e o volume de metal resultante será\nutilizado para a fabricação de esferas maciças com diâmetro de 1 cm, a serem usadas\npara confeccionar rolamentos. Para estimar a quantidade de esferas que poderão ser\nproduzidas a partir de cada uma das peças cilíndricas, admite-se que não ocorre perda de\nmaterial durante o processo de derretimento.\n\nQuantas dessas esferas poderão ser obtidas a partir de cada peça cilíndrica?",
    "options": {
      "A": "800",
      "B": "1 200",
      "C": "2 400",
      "D": "4 800",
      "E": "6 400\n\n\n                                                                                            /"
    },
    "answer": "D"
  },
  "solution": {
    "data": [
      "cilindro: r=4 cm e h=50 cm",
      "esferas: diâmetro 1 cm ⇒ R=0,5 cm",
      "sem perda de material"
    ],
    "goal": "Encontrar quantas esferas podem ser produzidas.",
    "hook": "Sem perda de material, o volume do cilindro vira a soma dos volumes das esferas.",
    "strategy": [
      "Calcular o volume do cilindro.",
      "Calcular o volume de uma esfera.",
      "Dividir o volume total pelo unitário."
    ],
    "steps": [
      {
        "label": "Volume do cilindro",
        "math": "V_c=\\pi4^2\\cdot50=800\\pi"
      },
      {
        "label": "Volume de uma esfera",
        "math": "V_e={4\\over3}\\pi(1/2)^3"
      },
      {
        "label": "Calcule (1/2)³",
        "math": "V_e={4\\over3}\\pi{1\\over8}={\\pi\\over6}"
      },
      {
        "label": "Número de esferas",
        "math": "n={V_c\\over V_e}={800\\pi\\over\\pi/6}"
      },
      {
        "label": "Cancele π e multiplique pelo inverso",
        "math": "n=800\\cdot6=4800"
      }
    ],
    "final_answer": "D"
  },
