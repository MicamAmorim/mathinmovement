  "question": {
    "stem": "A figura representa uma escada com três degraus, construída em concreto maciço, com suas medidas especificadas.\n\nDescrição da figura: Figura de uma escada com três degraus, localizada em frente a uma porta. Cada degrau tem piso e espelho em forma de retângulo e suas laterais são retangulares. O piso de cada degrau mede 1,0 metro por 0,25 metro, e o espelho de cada degrau mede 1,0 metro por 0,20 metro. Cada uma das paredes laterais da escada é formada por três retângulos justapostos: o primeiro mede 0,25 metro por 0,20 metro; o segundo mede 0,25 metro por 0,40 metro e o terceiro mede 0,25 metro por 0,60 metro. (Fim da descrição)\n\nNessa escada, pisos e espelhos têm formato retangular, e as paredes laterais têm formato de um polígono cujos lados adjacentes são perpendiculares. Pisos, espelhos e paredes laterais serão revestidos em cerâmica.\n\nA área a ser revestida em cerâmica, em metro quadrado, mede",
    "options": {
      "A": "1,20.",
      "B": "1,35.",
      "C": "1,65.",
      "D": "1,80.",
      "E": "1,95."
    },
    "answer": "E"
  },
  "solution": {
