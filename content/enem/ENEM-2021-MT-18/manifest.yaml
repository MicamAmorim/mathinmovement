  "question": {
    "stem": "Um povoado com 100 habitantes está passando por uma situação de seca\nprolongada e os responsáveis pela administração pública local decidem contratar a\nconstrução de um reservatório. Ele deverá ter a forma de um cilindro circular reto, cuja\nbase tenha 5 metros de diâmetro interno, e atender à demanda de água da população por\num período de exatamente sete dias consecutivos. No oitavo dia, o reservatório vazio é\ncompletamente reabastecido por carros-pipa.\n\n   Considere que o consumo médio diário por habitante é de 120 litros de água. Use 3\ncomo aproximação para .\n\nNas condições apresentadas, o reservatório deverá ser construído com uma altura interna\nmínima, em metro, igual a",
    "options": {
      "A": "1,12.",
      "B": "3,10.",
      "C": "4,35.",
      "D": "4,48.",
      "E": "5,60."
    },
    "answer": "D"
  },
