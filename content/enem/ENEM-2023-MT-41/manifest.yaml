  "question": {
    "stem": "O mastro de uma bandeira foi instalado perpendicularmente ao solo em uma região plana. Devido aos fortes ventos, três cabos de aço, de mesmo comprimento, serão instalados para dar sustentação ao mastro. Cada cabo de aço ficará perfeitamente esticado, com uma extremidade num ponto P do mastro, a uma altura h do solo, e a outra extremidade, num ponto no chão, como mostra a figura.\n\nDescrição da figura: A figura representa o mastro de uma bandeira instalado perpendicularmente ao solo de uma região plana. No mastro há um ponto P, a uma altura h do solo, que é vértice comum a três triângulos; os outros dois vértices de cada triângulo são: o ponto de fixação do mastro no chão e o ponto de fixação de um cabo no chão. Em cada triângulo, o ângulo oposto ao lado que contém parte do mastro mede alfa. (Fim da descrição)\n\nOs cabos de aço formam um ângulo alfa com o plano do chão.\nPor medida de segurança, há apenas três opções de instalação:\n\nopção 1: h é igual a 11 metros e alfa é igual a 30 graus\nopção 2: h é igual a 12 metros e alfa é igual a 45 graus\nopção 3: h é igual a 18 metros e alfa é igual a 60 graus\n\nA opção a ser escolhida é aquela em que a medida dos cabos seja a menor possível.\n\nQual será a medida, em metro, de cada um dos cabos a serem instalados?",
    "options": {
      "A": "Fração com numerador 22 vezes raiz quadrada de 3 e denominador 3",
      "B": "11 vezes raiz quadrada de 2",
      "C": "12 vezes raiz quadrada de 2",
      "D": "12 vezes raiz quadrada de 3",
      "E": "22"
    },
    "answer": "C"
  },
  "solution": {
    "data": [
      "cabo, mastro e chão formam triângulo retângulo",
      "opção 1: h=11 m, α=30°",
      "opção 2: h=12 m, α=45°",
      "opção 3: h=18 m, α=60°",
      "escolher o menor cabo"
    ],
    "goal": "Comparar os comprimentos dos três cabos.",
    "hook": "O cabo é a hipotenusa; o seno liga diretamente altura, ângulo e comprimento.",
    "strategy": [
      "Identificar h como cateto oposto e cabo como hipotenusa.",
      "Usar sen α=h/c.",
      "Calcular e comparar as três opções."
    ],
    "steps": [
      {
        "label": "Isole o cabo c",
        "math": "\\sin\\alpha={h\\over c}\\quad\\Rightarrow\\quad c={h\\over\\sin\\alpha}"
      },
      {
        "label": "Opção 1",
        "math": "c_1={11\\over\\sin30^\\circ}={11\\over1/2}=22"
      },
      {
        "label": "Opção 2",
        "math": "c_2={12\\over\\sin45^\\circ}={12\\over\\sqrt2/2}"
      },
      {
        "label": "Racionalize ou multiplique pelo inverso",
        "math": "c_2={24\\over\\sqrt2}={24\\sqrt2\\over2}=12\\sqrt2"
      },
      {
        "label": "Opção 3",
        "math": "c_3={18\\over\\sin60^\\circ}={18\\over\\sqrt3/2}=12\\sqrt3"
      },
      {
        "label": "Compare aproximações",
        "math": "12\\sqrt2\\approx16{,}97<12\\sqrt3\\approx20{,}78<22"
      }
    ],
    "final_answer": "C"
  },
