  "lesson": {
    "objective": "Demonstrar visualmente área de prismas retos.",
    "steps": [
      {
        "narration": "Cada face lateral vira um retângulo: lado da base × altura."
      },
      {
        "narration": "Da projeção do sólido para as medidas reais das faces."
      },
      {
        "narration": "As larguras somam o perímetro da base.",
        "math": "A_L=(\\ell_1+\\cdots+\\ell_n)h=P_bh"
      },
      {
        "narration": "Faltam as duas bases congruentes.",
        "math": "A_T=A_L+A_b+A_b"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "A_T=P_bh+2A_b"
      }
    ]
  },
