  "lesson": {
    "objective": "Demonstrar visualmente comprimento de arco.",
    "steps": [
      {
        "narration": "O arco ocupa a mesma fração angular da circunferência."
      },
      {
        "narration": "Aqui são 120°: três arcos iguais completam a volta.",
        "math": "3L=2\\pi r\\quad\\Rightarrow\\quad L=\\frac13\\,2\\pi r"
      },
      {
        "narration": "Para qualquer ângulo, usamos a mesma proporção.",
        "math": "\\frac{L}{2\\pi r}=\\frac{\\theta}{360^\\circ}"
      },
      {
        "narration": "Multiplique a circunferência total pela fração do ângulo.",
        "math": "L=\\frac{\\theta}{360^\\circ}\\,2\\pi r"
      },
      {
        "narration": "Em radianos, a relação fica ainda mais simples.",
        "math": "L=r\\theta\\quad(\\theta\\ \\text{em radianos})"
      }
    ]
  },
  "result": {
    "math": "L=r\\theta\\quad(\\theta\\ \\text{em radianos})"
  },
