    "objective": "Demonstrar visualmente relações métricas no triângulo retângulo.",
    "steps": [
      {
        "narration": "A altura à hipotenusa cria dois triângulos semelhantes."
      },
      {
        "narration": "Os ângulos em rosa são iguais: o outro par é complementar."
      },
      {
        "narration": "Da semelhança: h/m = n/h.",
        "math": "\\frac{h}{m}=\\frac{n}{h}"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "h^2=mn"
      },
      {
        "narration": "As projeções também relacionam os catetos à hipotenusa.",
        "math": "\\frac{n}{a}=\\frac{a}{c}"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "a^2=cn"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "\\frac{m}{b}=\\frac{b}{c}"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "b^2=cm"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "a^2=cn\\qquad b^2=cm"
      }
    ]
  },
