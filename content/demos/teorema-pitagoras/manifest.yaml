    "steps": [
      {
        "narration": "Quatro triângulos iguais cabem num quadrado de lado a+b.",
        "math": "(a+b)^2=4\\left(\\frac{ab}{2}\\right)+c^2"
      },
      {
        "narration": "A área central é c²."
      },
      {
        "narration": "Cada lado central é uma hipotenusa c."
      },
      {
        "narration": "Os ângulos agudos somam 90°: o centro é um quadrado.",
        "math": "a^2+2ab+b^2=2ab+c^2"
      },
      {
        "narration": "Cancele 2ab dos dois lados.",
        "math": "a^2+b^2=c^2"
      }
    ]
  },
