    "signature": "MIQUÉIAS AMORIM"
  },
  "lesson": {
    "objective": "Demonstrar visualmente escalas: comprimentos, áreas e volumes.",
    "steps": [
      {
        "narration": "Se todos os comprimentos dobram, k = 2."
      },
      {
        "narration": "A área recebe o fator duas vezes.",
        "math": "A'=(2L)^2=4L^2=2^2A"
      },
      {
        "narration": "No volume, o fator aparece em três dimensões."
      },
      {
        "narration": "Duas unidades em cada direção: 2 × 2 × 2 cubinhos.",
        "math": "V'=2\\cdot2\\cdot2\\,V=8V"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "V'=(kL)^3=k^3V"
      },
      {
        "narration": "Regra geral: expoente = dimensão medida.",
        "math": "L:k\\qquad A:k^2\\qquad V:k^3"
      }
    ]
  },
  "result": {
    "math": "L:k\\qquad A:k^2\\qquad V:k^3"
  },
