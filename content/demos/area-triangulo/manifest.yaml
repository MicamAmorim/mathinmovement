schema_version: 1
id: area-triangulo
type: demo
status: production
title: Área do triângulo
tags:
  - geometria
  - areas
  - triangulo

lesson:
  objective: Demonstrar visualmente por que a área do triângulo é metade do produto entre base e altura.
  hook: Por que aparece o fator um meio na fórmula da área?
  steps:
    - narration: Uma base e uma altura perpendicular determinam a área.
      visual:
        action: create_triangle
    - narration: Marcamos a altura perpendicular à base.
      visual:
        action: show_height
    - narration: Uma segunda cópia congruente pode ser girada e transladada para completar um paralelogramo.
      visual:
        action: complete_parallelogram
      math: 2A=bh
    - narration: O paralelogramo é formado por dois triângulos congruentes, então cada triângulo ocupa metade da área.
      visual:
        action: hold
      math: A=\frac{bh}{2}

result:
  math: A=\frac{bh}{2}

render:
  formats:
    - vertical
    - horizontal
  default_format: vertical
  engine: unified-v2

narration:
  enabled: false
