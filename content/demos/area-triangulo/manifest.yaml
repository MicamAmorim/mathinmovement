schema_version: 1
id: area-triangulo
type: demo
status: production
title: Área do triângulo
tags:
  - geometria
  - areas
  - triangulo

presentation:
  profile: motion_math_v1
  number: "01"
  category: ÁREAS
  formula: A=\frac{bh}{2}
  signature: MIQUÉIAS AMORIM
  captions:
    base_height: Uma base. Uma altura perpendicular.
    duplicate: Duas cópias iguais completam um paralelogramo.
    half: Cada triângulo ocupa metade da área.

lesson:
  objective: Demonstrar visualmente por que a área do triângulo é metade do produto entre base e altura.
  hook: Por que aparece o fator um meio na fórmula da área?
  steps:
    - narration: Uma base. Uma altura perpendicular.
      visual:
        action: create_triangle
    - narration: Duas cópias iguais completam um paralelogramo.
      visual:
        action: complete_parallelogram
      math: 2A=bh
    - narration: Cada triângulo ocupa metade da área.
      visual:
        action: conclude
      math: A=\frac{bh}{2}

result:
  math: A=\frac{bh}{2}

render:
  production_engine: dsl
  formats:
    - vertical
    - horizontal
  native_formats:
    - vertical
    - horizontal
  default_format: vertical
  native_engine: unified-v2
  native_ready: true
  native_renderer: area_triangle_parallelogram_v1
narration:
  enabled: false

