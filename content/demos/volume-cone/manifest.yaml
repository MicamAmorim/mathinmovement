  "lesson": {
    "objective": "Demonstrar visualmente volume do cone.",
    "steps": [
      {
        "narration": "Aproxime o cone por pirâmides regulares com mais e mais lados."
      },
      {
        "narration": "Toda pirâmide da sequência satisfaz V = A_b h / 3.",
        "math": "V_n=\\frac13A_{b,n}h"
      },
      {
        "narration": "Quando n cresce, a base poligonal tende ao círculo.",
        "math": "A_{b,n}\\longrightarrow \\pi r^2"
      },
      {
        "narration": "No limite, a pirâmide torna-se um cone.",
        "math": "V=\\frac13\\pi r^2h"
      }
    ]
  },
