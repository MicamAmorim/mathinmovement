  "lesson": {
    "objective": "Demonstrar visualmente circunferência e π.",
    "steps": [
      {
        "narration": "Uma volta completa, sem escorregar."
      },
      {
        "narration": "A distância percorrida é o comprimento C."
      },
      {
        "narration": "Compare com diâmetros de tamanho d = 2r.",
        "math": "C/d\\approx3{,}14159"
      },
      {
        "narration": "A razão não muda com a escala. Seu nome é π.",
        "math": "\\pi:=C/d"
      },
      {
        "narration": "O diâmetro mede dois raios.",
        "math": "C=\\pi d=2\\pi r"
      }
    ]
  },
  "result": {
    "math": "C=\\pi d=2\\pi r"
  },
