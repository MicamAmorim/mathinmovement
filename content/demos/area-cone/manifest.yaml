  "lesson": {
    "objective": "Demonstrar visualmente área do cone.",
    "steps": [
      {
        "narration": "Ao abrir a lateral, surge um setor circular de raio g."
      },
      {
        "narration": "O arco do setor tem o mesmo comprimento da circunferência da base.",
        "math": "L_{arco}=2\\pi r"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "\\frac{A_L}{\\pi g^2}=\\frac{2\\pi r}{2\\pi g}"
      },
      {
        "narration": "Área de setor = arco × raio ÷ 2.",
        "math": "A_L=\\frac{(2\\pi r)g}{2}=\\pi rg"
      },
      {
        "narration": "Some a base circular.",
        "math": "A_T=\\pi rg+\\pi r^2"
      }
    ]
  },
  "result": {
    "math": "A_T=\\pi rg+\\pi r^2"
  },
