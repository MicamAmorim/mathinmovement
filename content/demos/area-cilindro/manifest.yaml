  "lesson": {
    "objective": "Demonstrar visualmente área do cilindro.",
    "steps": [
      {
        "narration": "Corte uma geratriz vertical e abra a lateral."
      },
      {
        "narration": "As linhas verticais mantêm a altura h."
      },
      {
        "narration": "Uma volta na base se torna a largura do retângulo.",
        "math": "A_L=(2\\pi r)h"
      },
      {
        "narration": "A projeção virou planificação. Acrescente as duas tampas.",
        "math": "A_T=A_L+\\pi r^2+\\pi r^2"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "A_T=2\\pi rh+2\\pi r^2"
      }
    ]
  },
