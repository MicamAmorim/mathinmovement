  "lesson": {
    "objective": "Demonstrar visualmente relação de euler.",
    "steps": [
      {
        "narration": "Retire uma face do cubo e abra a superfície no plano.",
        "math": "V-E+F_{\\rm int}=8-12+5=1"
      },
      {
        "narration": "Apague uma aresta de um ciclo: uma região desaparece junto."
      },
      {
        "narration": "Restou uma árvore. Remova folhas e suas arestas.",
        "math": "1-0+0=1"
      },
      {
        "narration": "Cada remoção preserva V − E + F interno."
      },
      {
        "narration": "Em uma superfície convexa, o mesmo processo se aplica."
      },
      {
        "narration": "Devolva a face retirada: o total aumenta em 1.",
        "math": "V-E+F=1+1=2"
      }
    ]
  },
  "result": {
    "math": "V-E+F=1+1=2"
  },
