    "signature": "MIQUÉIAS AMORIM"
  },
  "lesson": {
    "objective": "Demonstrar visualmente área do setor circular.",
    "steps": [
      {
        "narration": "O setor é uma fração angular do círculo inteiro."
      },
      {
        "narration": "Três setores de 120° completam 360°.",
        "math": "3A_s=\\pi r^2\\quad\\Rightarrow\\quad A_s=\\frac13\\pi r^2"
      },
      {
        "narration": "Para um ângulo qualquer, usamos a fração da volta.",
        "math": "\\frac{A_s}{\\pi r^2}=\\frac{\\theta}{360^\\circ}"
      },
      {
        "narration": "A mesma proporção vale para as áreas.",
        "math": "A_s=\\frac{\\theta}{360^\\circ}\\pi r^2"
      },
      {
        "narration": "Em radianos: metade de r² vezes o ângulo.",
        "math": "A_s=\\frac12r^2\\theta\\quad(\\theta\\ \\mathrm{em\\ radianos})"
      }
    ]
  },
  "result": {
    "math": "A_s=\\frac12r^2\\theta\\quad(\\theta\\ \\mathrm{em\\ radianos})"
  },
