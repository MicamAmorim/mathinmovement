        "math": "d_b^2=a^2+b^2"
      },
      {
        "narration": "Agora use outro triângulo retângulo com a altura c.",
        "math": "D^2=d_b^2+c^2"
      },
      {
        "narration": "Substitua a diagonal da base.",
        "math": "D^2=a^2+b^2+c^2"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "D=\\sqrt{a^2+b^2+c^2}"
      }
    ]
  },
