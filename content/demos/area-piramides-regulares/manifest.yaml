  "lesson": {
    "objective": "Demonstrar visualmente área de pirâmides regulares.",
    "steps": [
      {
        "narration": "Cada face lateral é um triângulo de altura g."
      },
      {
        "narration": "Ao planificar, as faces triangulares ficam lado a lado."
      },
      {
        "narration": "A altura g pertence à face, não ao interior da pirâmide.",
        "math": "A_{\\rm face}=\\frac{\\ell g}{2}"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "A_L=n\\cdot\\frac{\\ell g}{2}=\\frac{P_bg}{2}"
      },
      {
        "narration": "Some a área da base.",
        "math": "A_T=A_b+\\frac{P_bg}{2}"
      }
    ]
  },
