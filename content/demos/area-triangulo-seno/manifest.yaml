  "lesson": {
    "objective": "Demonstrar visualmente área do triângulo usando seno.",
    "steps": [
      {
        "narration": "A fórmula comum usa base c e altura h.",
        "math": "A_{\\triangle}=\\frac{ch}{2}"
      },
      {
        "narration": "No triângulo retângulo, h = b sen A.",
        "math": "\\sin A=\\frac{h}{b}\\Rightarrow h=b\\sin A"
      },
      {
        "narration": "Substitua a altura.",
        "math": "A_{\\triangle}=\\frac{c(b\\sin A)}{2}"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "A_{\\triangle}=\\frac12bc\\sin A"
      }
    ]
  },
  "result": {
    "math": "A_{\\triangle}=\\frac12bc\\sin A"
  },
