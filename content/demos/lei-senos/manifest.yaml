  "lesson": {
    "objective": "Demonstrar visualmente lei dos senos.",
    "steps": [
      {
        "narration": "Trace uma altura e olhe para os dois triângulos retângulos."
      },
      {
        "narration": "A mesma altura pode ser escrita de duas formas.",
        "math": "h=b\\sin A"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "h=a\\sin B"
      },
      {
        "narration": "Iguale e reorganize.",
        "math": "b\\sin A=a\\sin B"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "\\frac{a}{\\sin A}=\\frac{b}{\\sin B}"
      },
      {
        "narration": "Repetindo com outra altura, entra o terceiro lado.",
        "math": "h'=c\\sin A=a\\sin C"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "\\frac{a}{\\sin A}=\\frac{c}{\\sin C}"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "\\frac{a}{\\sin A}=\\frac{b}{\\sin B}=\\frac{c}{\\sin C}"
      }
    ]
  },
  "result": {
    "math": "\\frac{a}{\\sin A}=\\frac{b}{\\sin B}=\\frac{c}{\\sin C}"
  },
