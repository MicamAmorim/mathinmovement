        "narration": "Cada seção tem área πr².",
        "math": "A_b=\\pi r^2"
      },
      {
        "narration": "Área constante em cada altura: some as camadas.",
        "math": "V=n\\pi r^2\\Delta h,\\quad n\\Delta h=h"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "V=A_bh"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "V=\\pi r^2h"
      }
