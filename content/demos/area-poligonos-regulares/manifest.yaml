      {
        "narration": "Do centro aos vértices: seis triângulos iguais."
      },
      {
        "narration": "O apótema é perpendicular ao lado: ele é a altura.",
        "math": "A_1=\\frac{\\ell a}{2}"
      },
      {
        "narration": "Some a área de cada triângulo, um por vez."
      },
      {
        "narration": "Para n lados, são n parcelas iguais.",
        "math": "A=n\\frac{\\ell a}{2}=\\frac{(n\\ell)a}{2}"
      },
      {
        "narration": "A soma dos lados é o perímetro: P = nℓ.",
        "math": "A=\\frac{Pa}{2}"
      }
    ]
