  "lesson": {
    "objective": "Demonstrar visualmente área do triângulo equilátero.",
    "steps": [
      {
        "narration": "A altura também é mediana."
      },
      {
        "narration": "Metade do equilátero é um triângulo retângulo.",
        "math": "h^2+\\left(\\frac\\ell2\\right)^2=\\ell^2"
      },
      {
        "narration": "Pitágoras fornece a altura.",
        "math": "h^2=\\ell^2-\\frac{\\ell^2}{4}"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "h^2=\\frac34\\ell^2"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "h=\\frac{\\sqrt3}{2}\\ell"
      },
      {
        "narration": "Substitua na fórmula da área do triângulo.",
        "math": "A=\\frac{\\ell h}{2}=\\frac{\\sqrt3}{4}\\ell^2"
      }
    ]
  },
  "result": {
    "math": "A=\\frac{\\ell h}{2}=\\frac{\\sqrt3}{4}\\ell^2"
  },
