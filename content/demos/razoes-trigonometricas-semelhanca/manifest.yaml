  "lesson": {
    "objective": "Demonstrar visualmente razões trigonométricas por semelhança.",
    "steps": [
      {
        "narration": "Mude o tamanho, mas preserve o mesmo ângulo θ."
      },
      {
        "narration": "Triângulos semelhantes multiplicam todos os lados pelo mesmo fator.",
        "math": "\\frac{op_1}{hip_1}=\\frac{op_2}{hip_2}"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "\\frac{k\\,op_1}{k\\,hip_1}=\\frac{op_1}{hip_1}"
      },
      {
        "narration": "Por isso as razões dependem do ângulo, não do tamanho.",
        "math": "\\sin\\theta=\\frac{op}{hip}\\quad \\cos\\theta=\\frac{adj}{hip}"
      },
      {
        "narration": "Continue a dedução algébrica indicada na animação.",
        "math": "\\tan\\theta=\\frac{op}{adj}"
      }
    ]
  },
  "result": {
    "math": "\\tan\\theta=\\frac{op}{adj}"
  },
