[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathinmovement"
version = "0.2.0.dev0"
description = "Engine declarativo para demonstrações matemáticas e resoluções ENEM em Manim"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
render = [
  "manim>=0.19.0,<0.22",
  "edge-tts>=7.2.8",
  "mutagen>=1.47.0",
]

[project.scripts]
mim = "mathinmovement.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
