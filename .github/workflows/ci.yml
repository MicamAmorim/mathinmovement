name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate registry and SQLite
        run: |
          python -m mathinmovement validate
          python -m mathinmovement db status

      - name: Check unified render commands
        run: |
          python -m mathinmovement render area-triangulo --format vertical --dry-run
          python -m mathinmovement render area-triangulo --format vertical --engine native --dry-run
          python -m mathinmovement render area-triangulo --format horizontal --dry-run
          python -m mathinmovement render area-triangulo --format horizontal --engine native --dry-run
          python -m mathinmovement render ENEM-2021-MT-11 --format vertical --dry-run
          python -m mathinmovement render ENEM-2021-MT-11 --format horizontal --dry-run
          python -m mathinmovement render ENEM-2021-MT-11 --format vertical --engine native --dry-run
          python -m mathinmovement render ENEM-2021-MT-11 --format horizontal --engine native --dry-run

      - name: Check visual DSL contracts
        run: |
          python -m mathinmovement dsl audit
          python -m mathinmovement dsl ops

      - name: Check DSL shadow render paths
        run: |
          python -m mathinmovement render area-triangulo --engine dsl --dry-run
          python -m mathinmovement render comprimento-circunferencia-pi --engine dsl --dry-run
          python -m mathinmovement render ENEM-2023-MT-29 --engine dsl --dry-run
          python -m mathinmovement render ENEM-2024-MT-30 --engine dsl --format horizontal --dry-run

      - name: Check voice and produce orchestration
        run: |
          python -m mathinmovement voice ENEM-2021-MT-11 --dry-run
          python -m mathinmovement produce ENEM-2021-MT-11 --skip-voice --dry-run
          python -m mathinmovement produce ENEM-2021-MT-11 --format horizontal --skip-voice --dry-run
